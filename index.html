 if(!photo.complete)return;
 const c=document.createElement('canvas'),w=150,h=186;c.width=w;c.height=h;

 for(let y=3;y<h-3;y+=2)for(let x=3;x<w-3;x+=2){

  const down=(data[k+w*4]*.299+data[k+w*4+1]*.587+data[k+w*4+2]*.114)/255;
  const edge=Math.abs(lum-right)+Math.abs(lum-down);

 const cx=W/2+panX,cy=H/2+panY,scale=Math.min(W,H)*.82*zoom;
 // Connect selected nearby star points to form a delicate constellation.
 ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
 ctx.strokeStyle='rgba(130,190,255,.20)';ctx.lineWidth=.0018;
 for(let i=0;i<faceStars.length;i+=5){let a=faceStars[i],b=faceStars[i+1];if(b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
 for(const s of faceStars){let tw=.7+.3*Math.sin(t*.0015+s.x*40);ctx.globalAlpha=s.a*tw;ctx.fillStyle='#d9efff';ctx.shadowBlur=.008;ctx.shadowColor='#8bcaff';ctx.beginPath();ctx.arc(s.x,s.y,s.r/scale*1.8,0,Math.PI*2);ctx.fill();}
 ctx.restore();ctx.globalAlpha=1;
}
function frame(t){ctx.clearRect(0,0,W,H);
 let g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.8);g.addColorStop(0,'#0b1b35');g.addColorStop(.55,'#050d20');g.addColorStop(1,'#02040c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.globalAlpha=s.a*(.65+.35*Math.sin(t*.001+s.tw));ctx.fillStyle='#d8eaff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
 if(scene<2){planets.forEach(p=>drawPlanet(p,t));}
 if(scene===2){drawFace(t);}
 requestAnimationFrame(frame);}
function setScene(n){scene=n;zoom=1;panX=0;panY=0;
 if(n===0){cap.textContent='Давай немного попутешествуем по Вселенной…';sub.textContent='Среди миллиардов звёзд найдётся одна особенная.';start.textContent='НАЧАТЬ ПУТЕШЕСТВИЕ';start.style.display='inline-block';hint.textContent='Потяни, чтобы осмотреться · колесо или два пальца — приблизить';}
 if(n===1){cap.textContent='Планеты нашей Солнечной системы';sub.textContent='Приближай и отдаляй. Посмотри, сколько красоты вокруг.';start.textContent='НАЙТИ ОСОБЕННОЕ СОЗВЕЗДИЕ';start.style.display='inline-block';hint.textContent='Нажми «+» или приблизь двумя пальцами';}
 if(n===2){cap.textContent='А это созвездие любви';sub.textContent='У Вселенной миллиарды звёзд. Но самая красивая для меня — именно эта.';start.style.display='none';hint.textContent='Приблизь созвездие, чтобы рассмотреть его';zoom=1.45;}
}
start.onclick=()=>setScene(scene===0?1:2);
function changeZoom(f){zoom=Math.max(.55,Math.min(5,zoom*f));}
document.getElementById('plus').onclick=()=>changeZoom(1.25);
document.getElementById('minus').onclick=()=>changeZoom(.8);
canvas.addEventListener('wheel',e=>{e.preventDefault();changeZoom(e.deltaY<0?1.12:.89)},{passive:false});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,px:panX,py:panY};if(pointers.size===2){let a=[...pointers.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom0=zoom;}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){panX=drag.px+(e.clientX-drag.x);panY=drag.py+(e.clientY-drag.y);}if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch0)zoom=Math.max(.55,Math.min(5,zoom0*d/pinch0));}});
function release(e){pointers.delete(e.pointerId);if(!pointers.size)drag=null;if(pointers.size<2)pinch0=0;}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')changeZoom(1.2);if(e.key==='-')changeZoom(.83);if(e.key==='ArrowLeft')panX-=30;if(e.key==='ArrowRight')panX+=30;if(e.key==='ArrowUp')panY-=30;if(e.key==='ArrowDown')panY+=30;});
window.addEventListener('resize',resize);resize();setScene(0);requestAnimationFrame(frame);
})();
</script></body></html>
