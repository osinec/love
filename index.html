<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Борис любит ласку ❤️</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Georgia, serif;
    background: #f8dce0;
    user-select: none;
}

.game {
    height: 100dvh;
    width: 100%;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#f5d9df, #fbe9d8);
}

/* КОМНАТА */

.wall {
    position: absolute;
    inset: 0 0 30% 0;
    background-color: #f8e1e1;
    background-image:
    radial-gradient(#eabfc8 1.5px, transparent 1.5px);
    background-size: 27px 27px;
}

.floor {
    position: absolute;
    bottom: 0;
    height: 32%;
    width: 100%;
    background: repeating-linear-gradient(
        90deg,
        #c98d70,
        #c98d70 55px,
        #d9a185 56px,
        #d9a185 110px
    );
    border-top: 9px solid #b77c66;
}

/* ОКНО */

.window {
    position: absolute;
    top: 14%;
    left: 7%;
    width: 33%;
    height: 27%;
    background: linear-gradient(#b9e5f3, #e4f5f5);
    border: 12px solid #fff4e8;
    border-radius: 8px;
    box-shadow: 0 4px 10px #ae7f7255;
}

.window:before {
    content: "";
    position: absolute;
    left: 50%;
    width: 7px;
    height: 100%;
    background: #fff4e8;
}

.window:after {
    content: "";
    position: absolute;
    top: 50%;
    height: 7px;
    width: 100%;
    background: #fff4e8;
}

.sun {
    position: absolute;
    width: 35px;
    height: 35px;
    background: #ffe79b;
    border-radius: 50%;
    top: 12%;
    right: 15%;
    box-shadow: 0 0 30px #ffe79b;
}

/* ШТОРЫ */

.curtain {
    position: absolute;
    top: 12%;
    left: 4%;
    width: 8%;
    height: 31%;
    background: #e9a6b6;
    border-radius: 0 0 30px 30px;
}

.curtain.right {
    left: 35%;
}

/* КОВЁР */

.rug {
    position: absolute;
    bottom: 9%;
    left: 15%;
    width: 70%;
    height: 23%;
    background: #e7a9b0;
    border-radius: 50%;
    border: 8px dashed #f7d4d2;
    box-shadow: inset 0 0 0 5px #d98e9b;
}

/* МЕБЕЛЬ */

.shelf {
    position: absolute;
    right: 4%;
    top: 26%;
    width: 20%;
    height: 8%;
    background: #b77c66;
    border-radius: 5px;
    box-shadow: 0 8px 0 #925e4e;
}

.plant {
    position: absolute;
    right: 8%;
    top: 17%;
    font-size: 38px;
}

.picture {
    position: absolute;
    right: 9%;
    top: 7%;
    width: 17%;
    height: 14%;
    border: 7px solid #bd8966;
    background: #fff0ce;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 28px;
}

/* НАДПИСЬ */

.header {
    position: absolute;
    top: 2%;
    width: 100%;
    text-align: center;
    z-index: 10;
    padding: 0 10px;
    color: #9e536b;
    text-shadow: 1px 2px white;
}

.header h2 {
    font-size: clamp(19px, 5vw, 27px);
    margin: 5px;
}

.header p {
    font-size: 14px;
    margin: 5px;
}

/* КОТ */

.cat-container {
    position: absolute;
    width: 76%;
    max-width: 340px;
    height: 300px;
    bottom: 19%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translate(-50%,0); }
    50% { transform: translate(-50%,-7px); }
}

.cat {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.body-cat {
    transform-origin: 160px 210px;
    transition: transform .5s ease;
}

.tail {
    transform-origin: 250px 210px;
    animation: tail 2s ease-in-out infinite;
}

@keyframes tail {
    0%,100% { transform: rotate(-8deg); }
    50% { transform: rotate(13deg); }
}

.ear {
    fill: #c8793e;
}

.eye {
    animation: blink 4s infinite;
    transform-origin: center;
}

@keyframes blink {
    0%,46%,50%,100% { transform: scaleY(1); }
    48% { transform: scaleY(.1); }
}

/* ИНСТРУМЕНТЫ */

.tools {
    position: absolute;
    bottom: 2%;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 20;
    padding: 0 8px;
}

.tool {
    width: 29%;
    max-width: 115px;
    height: 83px;
    background: #fff8f0;
    border: 3px solid #efc1c8;
    border-radius: 22px;
    box-shadow: 0 5px 0 #d9a0a9;
    font-size: 32px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #98586c;
    transition: .15s;
}

.tool span {
    font-size: 12px;
    margin-top: 4px;
}

.tool:active {
    transform: translateY(5px);
    box-shadow: none;
}

/* СЧЁТЧИК */

.counter {
    position: absolute;
    top: 12%;
    right: 5%;
    z-index: 15;
    background: #fff7ef;
    color: #a54c69;
    border: 2px solid #efb7c2;
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 15px;
    box-shadow: 0 3px 7px #a56a6a33;
}

/* СООБЩЕНИЕ */

.message {
    position: absolute;
    z-index: 12;
    bottom: 34%;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8ef;
    color: #a44d69;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 15px;
    white-space: nowrap;
    box-shadow: 0 3px 12px #89565a33;
}

/* СЕРДЕЧКИ */

.heart {
    position: absolute;
    pointer-events: none;
    z-index: 50;
    animation: heartUp 1.4s ease-out forwards;
}

@keyframes heartUp {
    0% {
        transform: translateY(0) scale(.5) rotate(0);
        opacity: 1;
    }
    100% {
        transform: translateY(-180px) scale(1.5) rotate(30deg);
        opacity: 0;
    }
}

/* ФИНАЛ */

.final {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #f8dce8;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    overflow: hidden;
    padding: 25px;
}

.final h1 {
    color: #b84e76;
    font-size: clamp(30px, 8vw, 44px);
    text-shadow: 2px 3px white;
    animation: appear 2s ease;
    z-index: 3;
}

.final p {
    font-size: 24px;
    color: #bd6784;
    z-index: 3;
}

.final-heart {
    position: absolute;
    font-size: 35px;
    animation: rain 4s linear infinite;
}

@keyframes rain {
    from { transform: translateY(-100px) rotate(0); }
    to { transform: translateY(110vh) rotate(360deg); }
}

@keyframes appear {
    from { opacity: 0; transform: scale(.3); }
    to { opacity: 1; transform: scale(1); }
}

@media(max-height:650px) {
    .cat-container { bottom: 16%; height: 240px; }
    .tools { bottom: 1%; }
    .tool { height: 68px; }
}
</style>
</head>

<body>

<div class="game" id="game">

    <div class="wall"></div>
    <div class="floor"></div>

    <div class="sun"></div>
    <div class="window"></div>
    <div class="curtain"></div>
    <div class="curtain right"></div>

    <div class="picture">🐱</div>
    <div class="plant">🪴</div>
    <div class="shelf"></div>

    <div class="header">
        <h2>Борис любит когда его ласкают и ухаживают ❤️</h2>
        <p>Побалуй маленького Бориску!</p>
    </div>

    <div class="counter" id="counter">
        💗 Ласки: 0 / 12
    </div>

    <div class="rug"></div>

    <div class="cat-container" id="catContainer">

        <svg class="cat" viewBox="0 0 320 300">

            <!-- ХВОСТ -->
            <g class="tail">
                <path d="M235 207 Q295 180 285 130 Q275 100 255 120"
                fill="none" stroke="#bd753f"
                stroke-width="23" stroke-linecap="round"/>
                <path d="M280 132 Q275 118 260 123"
                stroke="#f4d1ad" stroke-width="8"
                fill="none" stroke-linecap="round"/>
            </g>

            <g class="body-cat" id="bodyCat">

                <!-- ТЕЛО -->
                <ellipse cx="158" cy="211" rx="92" ry="67"
                fill="#dc995c" stroke="#a9693f" stroke-width="3"/>

                <!-- ЖИВОТИК -->
                <ellipse cx="165" cy="220" rx="58" ry="49"
                fill="#f7dcbf"/>

                <!-- ПОЛОСКИ -->
                <path d="M100 165 Q115 182 130 169"
                stroke="#a9693f" stroke-width="7"
                fill="none" stroke-linecap="round"/>

                <path d="M160 151 Q172 174 190 158"
                stroke="#a9693f" stroke-width="7"
                fill="none" stroke-linecap="round"/>

                <path d="M208 170 Q225 187 238 170"
                stroke="#a9693f" stroke-width="7"
                fill="none" stroke-linecap="round"/>

                <!-- ЛАПЫ -->
                <ellipse cx="100" cy="257" rx="27" ry="17"
                fill="#f1cba8" stroke="#a9693f" stroke-width="2"/>

                <ellipse cx="207" cy="257" rx="27" ry="17"
                fill="#f1cba8" stroke="#a9693f" stroke-width="2"/>

                <path d="M94 255 L94 264 M105 255 L105 264"
                stroke="#b47c59" stroke-width="2"/>

                <path d="M201 255 L201 264 M212 255 L212 264"
                stroke="#b47c59" stroke-width="2"/>

                <!-- ГОЛОВА -->
                <ellipse cx="158" cy="104" rx="76" ry="70"
                fill="#e4a365" stroke="#a9693f" stroke-width="3"/>

                <!-- УШИ -->
                <path class="ear" d="M93 70 L85 8 L139 49 Z"/>
                <path class="ear" d="M178 48 L226 8 L222 78 Z"/>

                <path d="M97 49 L94 22 L121 48 Z"
                fill="#efb0a7"/>

                <path d="M191 48 L216 24 L214 60 Z"
                fill="#efb0a7"/>

                <!-- ПОЛОСЫ НА ЛБУ -->
                <path d="M145 45 Q155 60 165 45"
                fill="none" stroke="#a9693f"
                stroke-width="6" stroke-linecap="round"/>

                <path d="M125 55 L135 65 M177 55 L187 65"
                stroke="#a9693f" stroke-width="5"
                stroke-linecap="round"/>

                <!-- ГЛАЗА -->
                <g class="eye">
                    <ellipse cx="126" cy="100" rx="12" ry="15"
                    fill="#55765b"/>
                    <ellipse cx="190" cy="100" rx="12" ry="15"
                    fill="#55765b"/>

                    <ellipse cx="129" cy="100" rx="4" ry="9"
                    fill="#252b25"/>
                    <ellipse cx="193" cy="100" rx="4" ry="9"
                    fill="#252b25"/>

                    <circle cx="123" cy="94" r="4" fill="white"/>
                    <circle cx="187" cy="94" r="4" fill="white"/>
                </g>

                <!-- ЩЁЧКИ -->
                <ellipse cx="107" cy="119" rx="18" ry="10"
                fill="#edaa9e" opacity=".7"/>

                <ellipse cx="208" cy="119" rx="18" ry="10"
                fill="#edaa9e" opacity=".7"/>

                <!-- МОРДОЧКА -->
                <ellipse cx="158" cy="128" rx="27" ry="19"
                fill="#f9e3cf"/>

                <!-- НОС -->
                <path d="M151 120 Q158 114 165 120 Q158 131 151 120"
                fill="#c77b85"/>

                <!-- РОТИК -->
                <path d="M158 129 Q149 140 142 132 M158 129 Q167 140 174 132"
                stroke="#71483e" stroke-width="2.5"
                fill="none" stroke-linecap="round"/>

                <!-- УСЫ -->
                <path d="M125 126 L83 119 M126 134 L83 140
                         M191 126 L233 119 M190 134 L233 140"
                stroke="#805a48" stroke-width="2"
                stroke-linecap="round"/>

            </g>
        </svg>

    </div>

    <div class="message" id="message">
        Муррр... погладь меня 💕
    </div>

    <!-- КНОПКИ -->

    <div class="tools">

        <button class="tool" onclick="care('pet')">
            ✋
            <span>Гладить</span>
        </button>

        <button class="tool" onclick="care('brush')">
            🪮
            <span>Расчёска</span>
        </button>

        <button class="tool" onclick="care('food')">
            🥣
            <span>Покормить</span>
        </button>

    </div>

</div>

<!-- ФИНАЛЬНЫЙ ЭКРАН -->

<div class="final" id="final">
    <h1>Бориска растворился в твоей любви, как я</h1>
    <p>❤️ ❤️ ❤️</p>
    <div style="font-size:95px; animation:appear 2s;">🐱</div>
    <p>Спасибо за всю эту нежность...</p>
</div>

<script>

let affection = 0;

const messages = {
    pet: [
        "Мурррр... как приятно! 💗",
        "Погладь меня ещё...",
        "Я тебя очень люблю!",
        "У Бориса настроение стало лучше!",
        "Мрррррр...",
        "Какие нежные ручки!",
        "Борис счастлив ❤️"
    ],

    brush: [
        "Ой, как красиво!",
        "Мне нравится причёсываться!",
        "Я самый красивый кот!",
        "Мур-мур, продолжай!",
        "Шёрстка стала пушистее!"
    ],

    food: [
        "Ням-ням! Очень вкусно!",
        "Спасибо за вкусняшку!",
        "Ещё немножечко!",
        "Борис доволен!",
        "Какой вкусный обед!"
    ]
};

function care(type) {

    if (affection >= 12) return;

    affection++;

    document.getElementById("counter").innerText =
        "💗 Ласки: " + affection + " / 12";

    let list = messages[type];

    document.getElementById("message").innerText =
        list[Math.floor(Math.random() * list.length)];

    // БОРИС СТАНОВИТСЯ ПУШИСТЕЕ И ТОЛЩЕ

    let growth = 1 + affection * 0.045;

    document.getElementById("bodyCat").style.transform =
        `scale(${growth}, ${1 + affection * 0.025})`;

    // СЕРДЕЧКИ

    for (let i = 0; i < 5; i++) {

        let heart = document.createElement("div");

        heart.className = "heart";

        heart.innerText = ["💗","💕","❤️","💖"][
            Math.floor(Math.random() * 4)
        ];

        heart.style.left = (35 + Math.random() * 35) + "%";
        heart.style.top = (40 + Math.random() * 25) + "%";

        document.getElementById("game").appendChild(heart);

        setTimeout(() => heart.remove(), 1500);
    }

    // ПОСЛЕДНЯЯ ЛАСКА

    if (affection === 12) {

        document.getElementById("message").innerText =
            "Борис переполнен любовью!!! ❤️";

        setTimeout(finalScene, 1000);
    }
}

function finalScene() {

    document.getElementById("game").style.display = "none";

    const final = document.getElementById("final");

    final.style.display = "flex";

    // МОРЕ СЕРДЕЧЕК

    for (let i = 0; i < 65; i++) {

        let heart = document.createElement("div");

        heart.className = "final-heart";

        heart.innerText = ["❤️","💗","💕","💖","💘","💝"][
            Math.floor(Math.random() * 6)
        ];

        heart.style.left = Math.random() * 100 + "%";
        heart.style.top = Math.random() * 100 + "%";

        heart.style.animationDelay = Math.random() * 4 + "s";

        final.appendChild(heart);
    }
}

</script>

</body>
</html>
