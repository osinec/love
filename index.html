<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бориска</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background: linear-gradient(180deg, #fff0f5 0%, #ffe4e9 40%, #ffd6e0 100%);
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Верхняя надпись */
  #top-text {
    margin-top: 28px;
    padding: 0 20px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #d46a8c;
    line-height: 1.4;
    text-shadow: 0 1px 0 #fff;
    z-index: 10;
  }

  /* Игровое поле */
  #game {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Кот */
  #cat {
    position: relative;
    font-size: 110px;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center bottom;
    z-index: 5;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
  }

  /* Спокойная анимация ходьбы */
  #cat.walking {
    animation: walk 2.8s ease-in-out infinite;
  }

  @keyframes walk {
    0%, 100% { transform: translateX(-12px) rotate(-3deg); }
    50%      { transform: translateX(12px) rotate(3deg); }
  }

  /* Когда гладят / кормят */
  #cat.happy {
    animation: happy 0.6s ease;
  }

  @keyframes happy {
    0%   { transform: scale(1) rotate(0); }
    30%  { transform: scale(1.15) rotate(-8deg); }
    60%  { transform: scale(1.1) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Боковые инструменты */
  .tool {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 20;
  }

  .tool:active {
    transform: scale(0.9);
  }

  #comb {
    left: 18px;
    top: 42%;
  }

  #bowl {
    right: 18px;
    top: 42%;
  }

  /* Кнопка погладить */
  #pet-btn {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff8fab;
    color: white;
    border: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(255, 143, 171, 0.4);
    cursor: pointer;
    z-index: 20;
    transition: transform 0.15s;
  }

  #pet-btn:active {
    transform: translateX(-50%) scale(0.95);
  }

  /* Счётчик */
  #counter {
    position: absolute;
    top: 90px;
    right: 20px;
    background: rgba(255,255,255,0.7);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    color: #c25a7a;
    font-weight: 600;
  }

  /* Финальный экран */
  #final {
    position: absolute;
    inset: 0;
    background: #fff0f5;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    overflow: hidden;
  }

  #final-text {
    font-size: 24px;
    font-weight: 700;
    color: #d46a8c;
    text-align: center;
    padding: 0 30px;
    line-height: 1.5;
    z-index: 10;
    animation: fadeIn 1.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Сердечки */
  .heart {
    position: absolute;
    font-size: 28px;
    animation: floatUp 3.5s ease-in forwards;
    pointer-events: none;
    opacity: 0.9;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(0.6) rotate(0deg);
      opacity: 0;
    }
    15% { opacity: 1; }
    100% {
      transform: translateY(-120vh) scale(1.4) rotate(360deg);
      opacity: 0;
    }
  }

  /* Взрыв кота */
  #cat.explode {
    animation: explode 0.8s ease-out forwards;
  }

  @keyframes explode {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.8) rotate(15deg); opacity: 0.8; }
    100% { transform: scale(0) rotate(40deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div id="top-text">Борис любит, когда его ласкают и ухаживают</div>
  <div id="counter">Ласк: 0 / 12</div>

  <div id="game">
    <div id="cat" class="walking">🐱</div>

    <div class="tool" id="comb" title="Расчесать">🪮</div>
    <div class="tool" id="bowl" title="Покормить">🥣</div>

    <button id="pet-btn">Погладить Бориску</button>
  </div>

  <div id="final">
    <div id="final-text">Бориска растворился<br>в твоей любви<br>как я 💕</div>
  </div>

<script>
  const cat = document.getElementById('cat');
  const counterEl = document.getElementById('counter');
  const finalScreen = document.getElementById('final');
  const petBtn = document.getElementById('pet-btn');
  const comb = document.getElementById('comb');
  const bowl = document.getElementById('bowl');

  let cares = 0;
  const maxCares = 12;

  // Базовый размер
  let scale = 1;

  function updateCat() {
    // С каждой лаской становится чуть толще
    scale = 1 + (cares * 0.085);
    cat.style.transform = `scale(${scale})`;
    counterEl.textContent = `Ласк: ${cares} / ${maxCares}`;
  }

  function doCare(type) {
    if (cares >= maxCares) return;

    cares++;
    updateCat();

    // Анимация радости
    cat.classList.remove('walking', 'happy');
    void cat.offsetWidth; // restart animation
    cat.classList.add('happy');

    // После анимации снова ходим
    setTimeout(() => {
      if (cares < maxCares) {
        cat.classList.remove('happy');
        cat.classList.add('walking');
      }
    }, 600);

    // Небольшой звук-эффект (вибрация на телефоне)
    if (navigator.vibrate) navigator.vibrate(30);

    // Если достигли 12
    if (cares >= maxCares) {
      setTimeout(explode, 700);
    }
  }

  function explode() {
    // Убираем инструменты
    petBtn.style.display = 'none';
    comb.style.display = 'none';
    bowl.style.display = 'none';
    counterEl.style.display = 'none';
    document.getElementById('top-text').style.display = 'none';

    // Взрыв кота
    cat.classList.remove('walking', 'happy');
    cat.classList.add('explode');

    // Запускаем сердечки
    setTimeout(() => {
      finalScreen.style.display = 'flex';
      spawnHearts();
    }, 600);
  }

  function spawnHearts() {
    const hearts = ['💖', '💕', '💗', '💓', '💘', '❤️', '🧡', '💛', '💚', '💙', '💜', '🤍'];
    
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.bottom = '-40px';
        h.style.fontSize = (20 + Math.random() * 28) + 'px';
        h.style.animationDuration = (2.8 + Math.random() * 2.2) + 's';
        document.body.appendChild(h);

        // Удаляем после анимации
        setTimeout(() => h.remove(), 5500);
      }, i * 80);
    }

    // Продолжаем сыпать сердечки
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.bottom = '-40px';
      h.style.fontSize = (18 + Math.random() * 24) + 'px';
      h.style.animationDuration = (3 + Math.random() * 2) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5500);
    }, 400);
  }

  // Обработчики
  petBtn.addEventListener('click', () => doCare('pet'));
  comb.addEventListener('click', () => doCare('comb'));
  bowl.addEventListener('click', () => doCare('bowl'));

  // Можно также гладить прямо по коту
  cat.addEventListener('click', () => doCare('pet'));
</script>
</body>
</html>
