<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ты моя звезда</title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02030b;
  touch-action: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.hint {
  position: fixed;
  bottom: 35px;
  left: 0;
  width: 100%;
  text-align: center;
  color: rgba(220,230,255,.65);
  font: 13px Arial, sans-serif;
  letter-spacing: 2px;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="hint">ПРИБЛИЖАЙ КОСМОС</div>
<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
let w, h, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  w = innerWidth;
  h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  createTextTargets();
}
addEventListener("resize", resize);
// Создаём надпись на невидимом холсте.
// Координаты точек будут целями для уже существующих звёзд.
const textCanvas = document.createElement("canvas");
const textCtx = textCanvas.getContext("2d");
let targets = [];
function createTextTargets() {
  textCanvas.width = w;
  textCanvas.height = h;
  textCtx.clearRect(0, 0, w, h);
  const fontSize = Math.min(w * 0.145, 68);
  textCtx.textAlign = "center";
  textCtx.textBaseline = "middle";
  textCtx.fillStyle = "#fff";
  textCtx.font = `bold ${fontSize}px Arial`;
  textCtx.fillText("Ты моя", w / 2, h / 2 - fontSize * .65);
  textCtx.fillText("звезда", w / 2, h / 2 + fontSize * .65);
  const pixels = textCtx.getImageData(0, 0, w, h).data;
  targets = [];
  // Берём точки с достаточной плотностью,
  // чтобы буквы были хорошо различимы.
  const step = Math.max(2, Math.floor(w / 190));
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const alpha = pixels[(y * w + x) * 4 + 3];
      if (alpha > 120) {
        targets.push({ x, y });
      }
    }
  }
  // Перемешиваем цели, чтобы звёзды собирались равномерно.
  for (let i = targets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [targets[i], targets[j]] = [targets[j], targets[i]];
  }
  // Каждой существующей звезде назначаем точку в надписи.
  stars.forEach((star, i) => {
    star.target = targets[i % targets.length];
  });
}
// Все звёзды создаются один раз в начале.
// При финальном приближении новые звёзды не добавляются.
const stars = [];
const STAR_COUNT = 1100;
for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 1.5 + .35,
    alpha: Math.random() * .65 + .25,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * .8 + .2,
    target: null
  });
}
// Прогресс приближения от 0 до 1.
let progress = 0;
let targetProgress = 0;
function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}
function smoothstep(a, b, x) {
  x = clamp((x - a) / (b - a), 0, 1);
  return x * x * (3 - 2 * x);
}
// Управление pinch-жестом.
let pointers = new Map();
let lastDistance = 0;
function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    lastDistance = distance(p[0], p[1]);
  }
});
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    const current = distance(p[0], p[1]);
    if (lastDistance > 0) {
      const change = current / lastDistance;
      targetProgress += Math.log(change) * .28;
      targetProgress = clamp(targetProgress, 0, 1);
    }
    lastDistance = current;
  }
});
function releasePointer(e) {
  pointers.delete(e.pointerId);
  lastDistance = 0;
}
canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);
// Для проверки на компьютере — колесо мыши.
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  targetProgress += -e.deltaY * .0007;
  targetProgress = clamp(targetProgress, 0, 1);
}, { passive: false });
// Плавное движение каждой звезды к своей точке.
function draw(time) {
  requestAnimationFrame(draw);
  progress += (targetProgress - progress) * .045;
  ctx.fillStyle = "#02030b";
  ctx.fillRect(0, 0, w, h);
  // Небольшая глубина пространства.
  const formation = smoothstep(.08, .88, progress);
  // Фоновое свечение усиливается по мере формирования текста.
  const glow = ctx.createRadialGradient(
    w / 2, h / 2, 0,
    w / 2, h / 2, Math.max(w, h) * .65
  );
  glow.addColorStop(0, `rgba(27,35,85,${.05 + formation * .17})`);
  glow.addColorStop(1, "rgba(2,3,11,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    // Исходная позиция — та же самая на протяжении всего путешествия.
    const startX = s.x * w;
    const startY = s.y * h;
    const target = s.target;
    const endX = target ? target.x : startX;
    const endY = target ? target.y : startY;
    const x = startX + (endX - startX) * formation;
    const y = startY + (endY - startY) * formation;
    const twinkle = .72 + Math.sin(time * .001 * s.speed + s.phase) * .22;
    const alpha = s.alpha * twinkle;
    // При сборке звёзды становятся ярче и чуть чётче.
    const size = s.size * (1 + formation * .55);
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(225,235,255,${alpha})`;
    ctx.fill();
    // Мягкое свечение вокруг звёзд надписи.
    if (formation > .45 && i % 3 === 0) {
      ctx.beginPath();
      ctx.arc(x, y, size * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(145,175,255,${formation * .10})`;
      ctx.fill();
    }
  }
  // Лёгкое свечение букв помогает сделать фразу читаемой.
  if (formation > .7) {
    ctx.save();
    ctx.globalAlpha = smoothstep(.7, 1, formation) * .16;
    ctx.shadowColor = "#9bbcff";
    ctx.shadowBlur = 22;
    ctx.fillStyle = "#a9c8ff";
    ctx.font = `bold ${Math.min(w * .145, 68)}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Ты моя", w / 2, h / 2 - Math.min(w * .145, 68) * .65);
    ctx.fillText("звезда", w / 2, h / 2 + Math.min(w * .145, 68) * .65);
    ctx.restore();
  }
}
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
