<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Reef — пиксельный аквариум</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh;
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
    padding: 8px;
    background: radial-gradient(ellipse at 50% 0%, #1d4265 0%, #101b35 48%, #080d1d 100%);
    color: #d8f7ff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    user-select: none;
  }
  .app { width: 100%; max-width: 1120px; }
  header { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .eyebrow { color: #77e6db; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; }
  h1 { margin-top: 2px; font-size: clamp(18px, 4vw, 38px); letter-spacing: -.06em; line-height: 1; font-weight: bold; }
  h1 span { color: #70e9dc; }
  .subtitle { margin-top: 4px; font-size: 10px; color: #9abbd1; }
  .status { display: flex; align-items: center; gap: 4px; color: #a9d5e7; font-size: 9px; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #6fffc4; box-shadow: 0 0 12px #6fffc4; }
  .tank-shell {
    padding: 6px;
    border: 1px solid #47718b;
    border-radius: 9px;
    background: linear-gradient(135deg, #527e99, #172d49 32%, #0b1830 70%, #4a7890);
    box-shadow: 0 24px 70px #0008, inset 0 0 0 2px #071326;
  }
  .tank {
    position: relative;
    overflow: hidden;
    border: 2px solid #07172a;
    background: #07334c;
    aspect-ratio: 16 / 9;
    min-height: 200px;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
  }
  .glass-glint {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: linear-gradient(112deg, #ffffff0b 0%, transparent 23%, transparent 72%, #b8f4ff0b 100%);
    box-shadow: inset 0 0 24px #020e24a8;
  }
  .tank-label {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 4px 6px;
    background: #06172c99;
    border: 1px solid #8bd4e333;
    font-size: 8px;
    letter-spacing: .12em;
    color: #a8eaf1;
    pointer-events: none;
  }
  .tank-label span { color: #6fffc4; }
  .hint {
    position: absolute;
    top: 8px;
    right: 8px;
    max-width: 140px;
    padding: 4px 8px;
    background: #06172ccc;
    border: 1px solid #8bd4e333;
    border-radius: 4px;
    font-size: 8px;
    color: #c5e8ef;
    line-height: 1.4;
    pointer-events: none;
  }
  .quest-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
    animation: fadeIn 0.5s ease-out;
  }
  .quest-box {
    background: #06172cee;
    border: 2px solid #8bd4e355;
    border-radius: 8px;
    padding: 12px 16px;
    max-width: 280px;
    text-align: center;
    pointer-events: auto;
    cursor: pointer;
  }
  .quest-text { font-size: 11px; color: #ffd4e4; line-height: 1.5; }
  .quest-hint { font-size: 9px; color: #6f95ad; margin-top: 8px; }
  .progress-dots {
    position: absolute;
    bottom: 8px;
    left: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    pointer-events: none;
  }
  .progress-dots span { font-size: 8px; color: #6f95ad; margin-right: 4px; }
  .progress-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #44617a;
    transition: all 0.3s;
  }
  .progress-dot.active { background: #6fffc4; box-shadow: 0 0 4px #6fffc4; }
  .night-hint {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 8px;
    color: #6f95ad;
    pointer-events: none;
  }
  .tools {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  button {
    font: inherit;
    font-size: 12px;
    color: #d9f7ff;
    background: linear-gradient(#173a58, #10263f);
    border: 1px solid #416b87;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    transition: all 0.12s;
  }
  button:hover { border-color: #86e9ec; background: linear-gradient(#205170, #14314e); }
  button:active { transform: translateY(1px); }
  button.active-sponge { border-color: #f0c84a; background: #f0c84a22; color: #ffe88a; }
  button.active-net { border-color: #a9f5ff; background: #a9f5ff22; color: #c5f8ff; }
  button.active-feed { border-color: #ffe27a; background: #ffe27a22; color: #fff6ad; }
  .footer {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    font-size: 8px;
    color: #6f95ad;
    line-height: 1.5;
    flex-wrap: wrap;
  }
  .footer b { color: #a3d9e5; font-weight: 500; }

  .gift-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
  }
  .gift-overlay.show { display: flex; }
  .gift-content {
    position: relative;
    animation: giftPop 0.5s ease-out;
  }
  .gift-box {
    font-size: 64px;
    cursor: pointer;
    animation: float 2s ease-in-out infinite;
  }
  .gift-hint {
    position: absolute;
    top: -32px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 14px;
    color: #f9a8d4;
    animation: pulse 2s ease-in-out infinite;
  }
  .gift-card {
    position: relative;
    background: linear-gradient(to bottom right, rgba(131, 24, 67, 0.9), rgba(88, 28, 135, 0.9));
    border: 2px solid #f472b6;
    border-radius: 8px;
    padding: 32px;
    max-width: 448px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  .sparkle {
    position: absolute;
    font-size: 24px;
    animation: sparkle 1.5s ease-in-out infinite;
  }
  .sparkle:nth-child(1) { top: -16px; left: -16px; }
  .sparkle:nth-child(2) { top: -16px; right: -16px; animation-delay: 0.5s; }
  .sparkle:nth-child(3) { bottom: -16px; left: -16px; animation-delay: 1s; }
  .sparkle:nth-child(4) { bottom: -16px; right: -16px; animation-delay: 1.5s; }
  .gift-emoji { font-size: 48px; margin-bottom: 16px; animation: float 2s ease-in-out infinite; }
  .gift-title { font-size: 24px; font-weight: bold; color: #fce7f3; margin-bottom: 12px; }
  .gift-text { color: #fce7f3; margin-bottom: 24px; font-size: 14px; line-height: 1.6; }
  .gift-text br { margin-bottom: 8px; }
  .achievement {
    background: linear-gradient(to right, rgba(31, 41, 55, 0.9), rgba(17, 24, 39, 0.9));
    border: 1px solid rgba(234, 179, 8, 0.5);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .achievement-icon { font-size: 36px; }
  .achievement-label { color: #facc15; font-size: 12px; margin-bottom: 4px; }
  .achievement-title { color: white; font-weight: bold; font-size: 14px; }
  .achievement-desc { color: #9ca3af; font-size: 12px; }
  .close-btn {
    padding: 8px 24px;
    background: #ec4899;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .close-btn:hover { background: #db2777; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes giftPop {
    from { opacity: 0; transform: translateY(10px) scale(0.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  @keyframes sparkle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }

  @media (min-width: 640px) {
    body { padding: 16px; }
    .eyebrow { font-size: 11px; }
    .subtitle { font-size: 12px; }
    .status { font-size: 11px; gap: 8px; }
    .dot { width: 8px; height: 8px; }
    .tank-shell { padding: 9px; }
    .tank { min-height: 280px; }
    .tank-label { top: 12px; left: 14px; padding: 6px 8px; font-size: 10px; }
    .hint { top: 12px; right: 12px; max-width: 180px; padding: 6px 10px; font-size: 10px; }
    .progress-dots { bottom: 8px; left: 12px; }
    .night-hint { bottom: 8px; right: 12px; }
    .tools { margin-top: 16px; gap: 12px; }
    button { font-size: 14px; padding: 8px 16px; }
    .footer { margin-top: 12px; font-size: 10px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <div class="eyebrow">✦ Tiny underwater world</div>
      <h1>PIXEL <span>REEF</span></h1>
      <p class="subtitle">Маленький океан, который живёт своей жизнью.</p>
    </div>
    <div class="status">
      <span class="dot"></span>
      <span>ЭКОСИСТЕМА АКТИВНА</span>
    </div>
  </header>

  <section class="tank-shell">
    <div class="tank" id="tank">
      <canvas id="ocean" width="320" height="180"></canvas>
      <div class="glass-glint"></div>
      <div class="tank-label">
        REEF-01 <span>● LIVE</span><br>
        <span style="color:#8eb9cf">DEPTH: 12 M</span>
      </div>
      <div class="hint" id="hint">Выбери инструмент ✦</div>
      <div class="progress-dots">
        <span>✦</span>
        <div class="progress-dot" id="dot1"></div>
        <div class="progress-dot" id="dot2"></div>
        <div class="progress-dot" id="dot3"></div>
        <div class="progress-dot" id="dot4"></div>
      </div>
      <div class="night-hint" id="nightHint">☾ dbl-click</div>
    </div>
  </section>

  <div class="tools">
    <button id="btnSponge">🧽 <span class="tool-label">Губка</span></button>
    <button id="btnNet">🥅 <span class="tool-label">Сачок</span></button>
    <button id="btnFeed">🍞 <span class="tool-label">Корм</span></button>
  </div>

  <div class="footer">
    <span><b>УПРАВЛЕНИЕ:</b> <span class="footer-hint">выбери инструмент ↓</span></span>
    <span class="footer-credit">СОЗДАНО С ПИКСЕЛЬНОЙ ЛЮБОВЬЮ <b>▣</b></span>
  </div>
</main>

<div class="gift-overlay" id="giftOverlay">
  <div class="gift-content" id="giftContent">
    <div class="gift-box" id="giftBox">🎁</div>
    <div class="gift-hint">Нажми, чтобы открыть! ✨</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  const palettes = [
    { body: '#ffb84e', shade: '#e8753e', fin: '#ffe18a', eye: '#14263b' },
    { body: '#ff7fa9', shade: '#e84f83', fin: '#ffc2d5', eye: '#14263b' },
    { body: '#75e6d2', shade: '#2caaa9', fin: '#b7fff0', eye: '#14263b' },
    { body: '#a7a1ff', shade: '#7067d9', fin: '#d9d4ff', eye: '#14263b' },
    { body: '#f4e875', shade: '#d3a942', fin: '#fff6ad', eye: '#14263b' },
    { body: '#f5f6ff', shade: '#8cb9d2', fin: '#c8f1ff', eye: '#14263b' }
  ];

  function makeFish(x, y, scale, dir, pal, depth = 1) {
    const baseSpeed = rand(0.13, 0.34) / scale;
    return {
      x, y, baseY: y, targetY: y, scale, dir,
      speed: baseSpeed, baseSpeed,
      pal: pal || pick(palettes),
      phase: rand(0, 7), wander: rand(0.3, 1.4),
      kind: Math.random() < 0.25 ? 'long' : 'normal',
      state: 'swimming', stateTimer: rand(60, 300),
      turnProgress: 0,
      personality: pick(['bold', 'timid', 'lazy', 'curious']),
      schoolId: Math.floor(Math.random() * 3),
      tailPhase: rand(0, 7),
      depthLayer: depth,
      biteCount: 0
    };
  }

  function makeDirtSpots() {
    const spots = [];
    const positions = [
      { x: 55, y: 38 }, { x: 195, y: 60 }, { x: 115, y: 95 },
      { x: 265, y: 45 }, { x: 155, y: 28 }, { x: 80, y: 75 }
    ];
    for (const pos of positions) {
      const radius = rand(14, 22);
      const pixels = [];
      const count = Math.floor(radius * 2.5);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * radius;
        pixels.push({
          dx: Math.cos(angle) * dist,
          dy: Math.sin(angle) * dist,
          size: 2 + Math.floor(Math.random() * 2),
          ci: Math.floor(Math.random() * 3)
        });
      }
      spots.push({ x: pos.x, y: pos.y, radius, health: 100, pixels });
    }
    return spots;
  }

  const dirtColors = ['rgba(60,50,35,0.7)', 'rgba(80,75,50,0.6)', 'rgba(45,65,55,0.55)'];

  const state = {
    time: 0,
    night: false,
    tool: null,
    food: [],
    bubbles: [],
    fish: [],
    particles: [],
    dirtSpots: makeDirtSpots(),
    naughtyFish: null,
    scrubbing: false,
    mouseX: 160,
    mouseY: 90,
    mouseInCanvas: false,
    feedGiven: false,
    bgFish: [],
    whaleTimer: 0,
    whaleX: -80,
    whaleVisible: false,
    thermalBubbles: [],
    hearts: [],
    catfish1: { x: 80, y: 142, dir: 1, romanticTimer: 0, isRomantic: false, targetX: 80 },
    catfish2: { x: 240, y: 142, dir: -1, romanticTimer: 0, isRomantic: false, targetX: 240 },
    currentQuest: 1,
    showQuest: true,
    questTimer: null
  };

  // Initialize fish
  for (let i = 0; i < 4; i++) {
    state.fish.push(makeFish(rand(35, 280), rand(35, 100), pick([1.2, 1.5]), Math.random() < 0.5 ? 1 : -1, undefined, 2));
  }
  for (let i = 0; i < 3; i++) {
    state.fish.push(makeFish(rand(35, 280), rand(40, 110), pick([0.9, 1]), Math.random() < 0.5 ? 1 : -1, undefined, 1));
  }
  for (let i = 0; i < 8; i++) {
    state.fish.push(makeFish(rand(20, 300), rand(30, 90), pick([0.5, 0.6, 0.7]), Math.random() < 0.5 ? 1 : -1, undefined, 0));
  }

  // Background fish
  for (let i = 0; i < 12; i++) {
    state.bgFish.push({
      x: rand(0, W), y: rand(25, 80),
      speed: rand(0.08, 0.18), dir: Math.random() < 0.5 ? 1 : -1,
      size: rand(2, 3.5), phase: rand(0, 7)
    });
  }

  // Thermal bubbles
  for (let i = 0; i < 5; i++) {
    state.thermalBubbles.push({ x: rand(40, 280), y: rand(100, 150), r: rand(1, 2), speed: rand(0.08, 0.2) });
  }

  // Regular bubbles
  for (let i = 0; i < 17; i++) {
    state.bubbles.push({ x: rand(8, 312), y: rand(0, H), r: pick([1, 1, 2]), speed: rand(0.12, 0.35), phase: rand(0, 7) });
  }

  // Particles
  for (let i = 0; i < 65; i++) {
    state.particles.push({ x: rand(0, W), y: rand(12, 148), phase: rand(0, 7), size: Math.random() < 0.8 ? 1 : 2 });
  }

  // Naughty fish
  const naughtyFish = makeFish(160, 75, 1.45, 1, { body: '#ff594f', shade: '#b92743', fin: '#ffc3a1', eye: '#111a2b' }, 2);
  naughtyFish.speed = 0.6;
  naughtyFish.baseSpeed = 0.6;
  naughtyFish.isNaughty = true;
  naughtyFish.personality = 'bold';
  state.fish.push(naughtyFish);
  state.naughtyFish = naughtyFish;

  function rect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  function burst(x, y, count = 12) {
    for (let i = 0; i < count; i++) {
      state.bubbles.push({
        x: x + rand(-7, 7), y: y + rand(-4, 4),
        r: pick([1, 1, 2]), speed: rand(0.2, 0.7), phase: rand(0, 7)
      });
    }
    if (state.bubbles.length > 100) state.bubbles.splice(0, state.bubbles.length - 100);
  }

  function checkCompletion() {
    const allClean = state.dirtSpots.every(sp => sp.health <= 0);
    const caught = state.naughtyFish?.caught || false;
    const fed = state.feedGiven;
    const bellyUpFish = state.fish.filter(f => f.state === 'belly-up' && !f.caught);
    const allBellyUpCaught = bellyUpFish.length === 0;

    // Update progress dots
    document.getElementById('dot1').classList.toggle('active', allClean);
    document.getElementById('dot2').classList.toggle('active', caught && allBellyUpCaught);
    document.getElementById('dot3').classList.toggle('active', fed);

    // Quest progression
    if (allClean && state.currentQuest === 1) {
      state.currentQuest = 2;
      showQuest();
    }
    if (caught && allBellyUpCaught && state.currentQuest === 2) {
      state.currentQuest = 3;
      showQuest();
    }
    if (fed && state.currentQuest === 3) {
      state.currentQuest = 4;
      showQuest();
    }
  }

  function showQuest() {
    state.showQuest = true;
    updateQuestDisplay();
    if (state.questTimer) clearTimeout(state.questTimer);
    state.questTimer = setTimeout(() => {
      state.showQuest = false;
      updateQuestDisplay();
    }, 5000);
  }

  function updateQuestDisplay() {
    const existing = document.querySelector('.quest-overlay');
    if (existing) existing.remove();

    if (state.showQuest && state.currentQuest <= 4) {
      const overlay = document.createElement('div');
      overlay.className = 'quest-overlay';
      overlay.onclick = () => {
        state.showQuest = false;
        updateQuestDisplay();
      };

      const box = document.createElement('div');
      box.className = 'quest-box';

      const text = document.createElement('div');
      text.className = 'quest-text';
      const quests = {
        1: '🧽 Эти рыбки скоро сдохнут если не помыть аквариум...',
        2: '🥅 Какой то пидр кусает моих рыбок. Надо выловить его и трупы павших',
        3: '🍞 Надо бы их покормить..',
        4: '👀 Кто то это там выглядывает?..'
      };
      text.textContent = quests[state.currentQuest];

      const hint = document.createElement('div');
      hint.className = 'quest-hint';
      hint.textContent = 'нажми чтобы закрыть';

      box.appendChild(text);
      box.appendChild(hint);
      overlay.appendChild(box);
      document.getElementById('tank').appendChild(overlay);
    }
  }

  // Drawing functions
  function drawFarBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (state.night) {
      g.addColorStop(0, '#040d1f');
      g.addColorStop(0.3, '#07162f');
      g.addColorStop(0.6, '#0b3450');
      g.addColorStop(1, '#164b5a');
    } else {
      g.addColorStop(0, '#0e5a7a');
      g.addColorStop(0.3, '#14708c');
      g.addColorStop(0.6, '#0a526f');
      g.addColorStop(1, '#0b394f');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Distant mountains
    ctx.fillStyle = state.night ? '#061828' : '#0a3a50';
    ctx.beginPath();
    ctx.moveTo(0, 120);
    ctx.lineTo(0, 95); ctx.lineTo(20, 80); ctx.lineTo(35, 90); ctx.lineTo(50, 72);
    ctx.lineTo(70, 85); ctx.lineTo(85, 78); ctx.lineTo(100, 92); ctx.lineTo(120, 82);
    ctx.lineTo(140, 95); ctx.lineTo(155, 88); ctx.lineTo(175, 75); ctx.lineTo(195, 88);
    ctx.lineTo(210, 80); ctx.lineTo(230, 92); ctx.lineTo(250, 78); ctx.lineTo(270, 85);
    ctx.lineTo(290, 72); ctx.lineTo(305, 82); ctx.lineTo(320, 90);
    ctx.lineTo(320, 120);
    ctx.closePath();
    ctx.fill();

    // Mid rocks
    ctx.fillStyle = state.night ? '#081e30' : '#0c4258';
    ctx.beginPath();
    ctx.moveTo(0, 130);
    for (let x = 0; x <= 320; x += 15) {
      ctx.lineTo(x, 108 + Math.sin(x * 0.1) * 8);
    }
    ctx.lineTo(320, 130);
    ctx.closePath();
    ctx.fill();
  }

  function drawSunRays() {
    if (state.night) {
      for (let i = 0; i < 20; i++) {
        const x = (i * 47 + 13) % W;
        const y = (i * 29 + 8) % 100;
        const alpha = Math.sin(state.time * 0.03 + i) * 0.5 + 0.5;
        if (alpha > 0.6) rect(x, y, 1, 1, `rgba(180,220,255,${alpha * 0.4})`);
      }
    } else {
      ctx.fillStyle = '#b9fff006';
      for (let i = 0; i < 6; i++) {
        const x = 20 + i * 55 + Math.sin(state.time * 0.004 + i) * 8;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 14, 0);
        ctx.lineTo(x + 50, 130);
        ctx.lineTo(x + 32, 130);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  function drawBackgroundFish() {
    for (const bf of state.bgFish) {

      const alpha = state.night ? 0.15 : 0.25;
      ctx.fillStyle = `rgba(140,200,210,${alpha})`;

      ctx.fillRect(x, y, Math.round(bf.size * 2), Math.round(bf.size));
      ctx.fillRect(x - bf.dir * 2, y - 1, 1, Math.round(bf.size + 1));

    if (state.whaleVisible) {
      const wx = Math.round(state.whaleX);
      const wy = 65 + Math.sin(state.time * 0.008) * 5;

      ctx.fillRect(wx - 8, wy - 4, 10, 5);

      ctx.fillRect(wx - 12, wy + 5, 6, 4);

  function drawCatfishPair() {
    const cf1 = state.catfish1;
    const cf2 = state.catfish2;

    if (cf1.isRomantic && cf2.isRomantic) {
      const midX = 160;
      if (cf1.x < midX - 3) cf1.x += 0.3;
      if (cf2.x > midX + 3) cf2.x -= 0.3;
      cf1.dir = 1;
      cf2.dir = -1;

      const dist = Math.abs(cf1.x - cf2.x);
      if (dist < 20 && state.time % 15 === 0) {
        state.hearts.push({ x: 160 + rand(-10, 10), y: 135, life: 60 });
      }

      cf1.romanticTimer--;
      cf2.romanticTimer--;
      if (cf1.romanticTimer <= 0) {
        cf1.isRomantic = false;
        cf2.isRomantic = false;
        cf1.targetX = rand(60, 120);
        cf2.targetX = rand(200, 260);
      }
    } else {
      if (!cf1.targetX || Math.abs(cf1.x - cf1.targetX) < 5) {
        cf1.targetX = rand(50, 140);
      }
      if (!cf2.targetX || Math.abs(cf2.x - cf2.targetX) < 5) {
        cf2.targetX = rand(180, 270);
      }

      if (cf1.x < cf1.targetX) { cf1.x += 0.15; cf1.dir = 1; }
      else if (cf1.x > cf1.targetX) { cf1.x -= 0.15; cf1.dir = -1; }

      if (cf2.x < cf2.targetX) { cf2.x += 0.15; cf2.dir = 1; }
      else if (cf2.x > cf2.targetX) { cf2.x -= 0.15; cf2.dir = -1; }

      if (Math.random() < 0.002 && !cf1.isRomantic) {
        cf1.isRomantic = true;
        cf2.isRomantic = true;
        cf1.romanticTimer = 400;
        cf2.romanticTimer = 400;
        cf1.targetX = 160;
        cf2.targetX = 160;
      }
    }

    drawCatfish(cf1.x, cf1.y, cf1.dir);
    drawCatfish(cf2.x, cf2.y, cf2.dir);

    for (let i = state.hearts.length - 1; i >= 0; i--) {
      const h = state.hearts[i];
      const hy = h.y - (60 - h.life) * 0.4;
      const alpha = h.life / 60;
      rect(h.x, hy, 2, 2, `rgba(255,107,157,${alpha})`);
      rect(h.x - 1, hy + 1, 1, 1, `rgba(255,107,157,${alpha})`);
      rect(h.x + 2, hy + 1, 1, 1, `rgba(255,107,157,${alpha})`);
      rect(h.x, hy + 2, 2, 1, `rgba(255,107,157,${alpha})`);
      h.life--;
      if (h.life <= 0) state.hearts.splice(i, 1);
    }
  }

  function drawFish(f) {
    const depthAlpha = f.depthLayer === 0 ? 0.3 : f.depthLayer === 1 ? 0.7 : 1.0;
    const x = Math.round(f.x);
    const y = Math.round(f.y + Math.sin(state.time * 0.03 + f.phase) * 2.5);
    const p = f.pal;
    const sc = f.scale * (f.depthLayer === 0 ? 0.8 : 1);

    ctx.save();
    ctx.globalAlpha = depthAlpha;
    ctx.translate(x, y);

    let drawDir = f.dir;
    let flipVertical = false;

    if (f.state === 'belly-up') {
      flipVertical = true;
      const wobble = Math.sin(state.time * 0.1 + f.phase) * 3;
      ctx.translate(0, wobble);
    }

    if (f.state === 'turning') {
      const squish = 1 - f.turnProgress * 0.3;
      ctx.scale(drawDir * sc * squish, flipVertical ? -sc : sc);
    } else {
      ctx.scale(drawDir * sc, flipVertical ? -sc : sc);
    }

    let tailSpeed = 0.22;
    if (f.state === 'darting' || f.state === 'fleeing') tailSpeed = 0.45;
    else if (f.state === 'idle' || f.state === 'belly-up') tailSpeed = 0.05;
    const flick = Math.sin(state.time * tailSpeed + f.tailPhase) > 0 ? 0 : 2;

    rect(-10, -2, 4, 4, p.shade);
    rect(-13, -4 - flick, 4, 4, p.fin);
    rect(-13, 1 + flick, 4, 4, p.fin);
    rect(-3, -5, 5, 3, p.fin);
    rect(1, 3, 5, 3, p.shade);
    rect(-7, -4, 15, 9, p.shade);
    rect(-5, -5, 11, 11, p.body);
    rect(4, -4, 5, 8, p.body);
    rect(3, -2, 1, 4, p.shade);
    rect(5, -3, 2, 2, '#fff7db');
    rect(6, -3, 1, 2, p.eye);

    if (f.state === 'belly-up') {
      rect(5, -3, 1, 1, '#ff0000');
      rect(7, -3, 1, 1, '#ff0000');
      rect(6, -2, 1, 1, '#ff0000');
    }

    ctx.restore();
  }

  function draw() {
    drawFarBackground();
    drawSunRays();
    drawBackgroundFish();
    drawSandFloor();
    drawCatfishPair();

    state.fish.filter(f => f.depthLayer === 0).forEach(drawFish);
    state.fish.filter(f => f.depthLayer === 1).forEach(drawFish);

  function updateFishAI(f) {
    if (f.caught) return;

    if (f.state === 'belly-up') {
      f.y -= 0.1;
      f.x += Math.sin(state.time * 0.02 + f.phase) * 0.1;
      f.y = Math.max(10, f.y);
      return;
    }

    f.stateTimer--;
    f.tailPhase += 0.1;

    if (f.stateTimer <= 0) {
      const roll = Math.random();
      if (f.personality === 'lazy') {
        if (roll < 0.3) { f.state = 'idle'; f.stateTimer = rand(80, 200); }
        else { f.state = 'swimming'; f.stateTimer = rand(100, 300); f.targetY = rand(30, 120); }
      } else {
        f.state = 'swimming';
        f.stateTimer = rand(80, 200);
        f.targetY = rand(30, 120);
      }
    }

    if (state.mouseInCanvas && state.mouseY < 150) {
      const dist = Math.hypot(f.x - state.mouseX, f.y - state.mouseY);
      const fleeRadius = f.personality === 'timid' ? 45 : f.personality === 'bold' ? 18 : 30;
      if (dist < fleeRadius && !f.isNaughty) {
        f.state = 'fleeing';
        f.stateTimer = 30;
        f.targetY = f.y + (f.y > state.mouseY ? 15 : -15);
      }
    }

    if (state.food.length > 0) {
      const closest = state.food.reduce((best, food) => {
        const d = Math.hypot(food.x - f.x, food.y - f.y);
        return d < best.dist ? { food, dist: d } : best;
      }, { food: state.food[0], dist: 999 });
      if (closest.dist < 80) {
        f.state = 'darting';
        f.stateTimer = 20;
        f.targetY = closest.food.y;
      }
    }

    let speedMult = 1;
    let verticalMove = 0;

    switch (f.state) {
      case 'swimming':
        speedMult = 1;
        verticalMove = (f.targetY - f.y) * 0.01;
        break;
      case 'idle':
        speedMult = 0.1;
        verticalMove = Math.sin(state.time * 0.01 + f.phase) * 0.1;
        break;
      case 'darting':
        speedMult = 2.2;
        verticalMove = (f.targetY - f.y) * 0.04;
        break;
      case 'fleeing':
        speedMult = 2.8;
        verticalMove = (f.targetY - f.y) * 0.06;
        break;
      case 'turning':
        speedMult = 0.3;
        f.turnProgress += 0.05;
        if (f.turnProgress >= 1) {
          f.state = 'swimming';
          f.stateTimer = rand(80, 200);
          f.turnProgress = 0;
        }
        break;
      case 'bitten':
        speedMult = 1.5;
        verticalMove = (f.targetY - f.y) * 0.03;
        f.stateTimer--;
        if (f.stateTimer <= 0) f.state = 'swimming';
        break;
    }

    f.speed = f.baseSpeed * speedMult;
    f.x += f.speed * f.dir;
    f.y += verticalMove + Math.sin(state.time * 0.015 + f.phase) * f.wander * 0.3;
    f.y = Math.max(15, Math.min(140, f.y));

    if (f.x > W - 10) {
      f.state = 'turning';
      f.turnProgress = 0;
      f.dir = -1;
      f.x = W - 10;
      f.targetY = rand(25, 125);
    }
    if (f.x < 10) {
      f.state = 'turning';
      f.turnProgress = 0;
      f.dir = 1;
      f.x = 10;
      f.targetY = rand(25, 125);
    }
  }

  function updateNaughtyFish() {
    const nf = state.naughtyFish;
    if (!nf || nf.caught) return;

    if (state.time % 60 === 0) {
      nf.targetY = rand(25, 120);
    }

    const targets = state.fish.filter(f => f !== nf && !f.caught && f.state !== 'belly-up' && f.depthLayer > 0);
    if (targets.length > 0) {
      let closest = targets[0];
      let minDist = 999;
      for (const t of targets) {
        const d = Math.hypot(nf.x - t.x, nf.y - t.y);
        if (d < minDist) { minDist = d; closest = t; }
      }

      if (minDist > 25) {
        nf.targetY = closest.y;
        nf.dir = closest.x > nf.x ? 1 : -1;
        nf.speed = nf.baseSpeed * 1.3;
      } else {
        if (state.time % 150 === 0) {
          closest.biteCount = (closest.biteCount || 0) + 1;
          closest.state = 'bitten';
          closest.stateTimer = 40;
          closest.targetY = closest.y + rand(-25, 25);
          burst(closest.x, closest.y, 5);

          if (closest.biteCount >= 4) {
            closest.state = 'belly-up';
            closest.speed = 0;
            closest.targetY = 10;

            const fromLeft = Math.random() < 0.5;
            const newFish = makeFish(
              fromLeft ? -10 : W + 10,
              rand(40, 110),
              closest.scale,
              fromLeft ? 1 : -1,
              closest.pal,
              closest.depthLayer
            );
            state.fish.push(newFish);
          }
        }
      }
    } else {
      nf.speed = nf.baseSpeed;
    }

    const yDiff = nf.targetY - nf.y;
    nf.y += yDiff * 0.02;
    nf.y = Math.max(15, Math.min(140, nf.y));

    nf.x += nf.speed * nf.dir;
    if (nf.x > W - 10) { nf.x = W - 10; nf.dir = -1; nf.targetY = rand(25, 120); }
    if (nf.x < 10) { nf.x = 10; nf.dir = 1; nf.targetY = rand(25, 120); }
  }

  function update() {
    state.time++;

    for (const f of state.fish) {
      if (!f.isNaughty) updateFishAI(f);
    }
    updateNaughtyFish();

    for (const bf of state.bgFish) {
      bf.x += bf.speed * bf.dir;
      if (bf.x > W - 5) { bf.x = W - 5; bf.dir = -1; }
      if (bf.x < 5) { bf.x = 5; bf.dir = 1; }
    }

    state.whaleTimer--;
    if (state.whaleTimer <= 0 && !state.whaleVisible) {
      if (Math.random() < 0.002) {
        state.whaleVisible = true;
        state.whaleX = -80;
        state.whaleTimer = rand(600, 1200);
      }
    }
    if (state.whaleVisible) {
      state.whaleX += 0.15;
      if (state.whaleX > W + 80) {
        state.whaleVisible = false;
        state.whaleTimer = rand(400, 1000);
      }
    }

    for (const tb of state.thermalBubbles) {
      tb.y -= tb.speed;
      if (tb.y < 80) { tb.y = 150; tb.x = rand(40, 280); }
    }

    for (const b of state.bubbles) {
      b.y -= b.speed;
      if (b.y < -5) { b.y = H - 30; b.x = rand(5, W - 5); }
    }

    for (let i = state.food.length - 1; i >= 0; i--) {
      state.food[i].y += 0.22;
      state.food[i].x += Math.sin(state.time * 0.08 + i) * 0.1;
      if (state.food[i].y > 148 || state.time - state.food[i].born > 480) state.food.splice(i, 1);
    }

    draw();
    requestAnimationFrame(update);
  }

  // Event handlers
  function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }

  canvas.addEventListener('pointermove', e => {
    const p = canvasPoint(e);
    state.mouseX = p.x;
    state.mouseY = p.y;
    state.mouseInCanvas = true;

    if (state.scrubbing && state.tool === 'sponge') {
      for (const spot of state.dirtSpots) {
        if (spot.health <= 0) continue;
        const dist = Math.hypot(spot.x - p.x, spot.y - p.y);
        if (dist < spot.radius + 14) {
          spot.health = Math.max(0, spot.health - 4);
        }
      }
      checkCompletion();
    }
  });

  canvas.addEventListener('pointerdown', e => {
    const p = canvasPoint(e);
    state.mouseX = p.x;
    state.mouseY = p.y;
    state.mouseInCanvas = true;

    // Check castle click
    if (p.x > 130 && p.x < 160 && p.y > 128 && p.y < 148) {
      document.getElementById('giftOverlay').classList.add('show');
      burst(p.x, p.y, 20);
      for (let i = 0; i < 8; i++) {
        state.hearts.push({ x: p.x + rand(-15, 15), y: p.y, life: 80 });
      }
      document.getElementById('hint').textContent = '💗 Ты нашла секрет! 💗';
      return;
    }

    if (state.tool === 'sponge') {
      state.scrubbing = true;
      for (const spot of state.dirtSpots) {
        if (spot.health <= 0) continue;
        const dist = Math.hypot(spot.x - p.x, spot.y - p.y);
        if (dist < spot.radius + 14) {
          spot.health = Math.max(0, spot.health - 8);
        }
      }
      checkCompletion();
    } else if (state.tool === 'net') {
      const nf = state.naughtyFish;
      if (nf && !nf.caught && Math.hypot(nf.x - p.x, nf.y - p.y) < 29) {
        nf.caught = true;
        state.fish = state.fish.filter(f => f !== nf);
        burst(p.x, p.y, 24);
        document.getElementById('hint').textContent = 'Поймала! ✦';
        checkCompletion();
        return;
      }

      const bellyUpFish = state.fish.find(f => f.state === 'belly-up' && Math.hypot(f.x - p.x, f.y - p.y) < 20);
      if (bellyUpFish) {
        bellyUpFish.caught = true;
        state.fish = state.fish.filter(f => f !== bellyUpFish);
        burst(p.x, p.y, 15);
        document.getElementById('hint').textContent = 'Спасла рыбку! ✦';
        checkCompletion();
        return;
      }

      burst(p.x, p.y, 5);
      document.getElementById('hint').textContent = 'Промах! ✦';
    } else if (state.tool === 'feed') {
      for (let i = 0; i < 10; i++) {
        state.food.push({ x: p.x + rand(-15, 15), y: p.y + rand(-8, 5), born: state.time });
      }
      burst(p.x, p.y, 6);
      state.feedGiven = true;
      state.fish.forEach(f => { if (!f.isNaughty) f.speed *= 1.05; });
      document.getElementById('hint').textContent = 'Рыбки довольны! ✦';
      checkCompletion();
    } else {
      burst(p.x, p.y, 10);
      for (const f of state.fish) {
        if (Math.hypot(f.x - p.x, f.y - p.y) < 35) {
          f.state = 'fleeing';
          f.stateTimer = 40;
          f.dir = f.x < p.x ? -1 : 1;
          f.targetY = Math.max(20, Math.min(130, f.y + (f.y > p.y ? 20 : -20)));
        }
      }
      document.getElementById('hint').textContent = 'Выбери инструмент ✦';
    }
  });

  canvas.addEventListener('pointerup', () => { state.scrubbing = false; });
  canvas.addEventListener('pointerenter', () => { state.mouseInCanvas = true; });
  canvas.addEventListener('pointerleave', () => { state.mouseInCanvas = false; state.scrubbing = false; });

  canvas.addEventListener('dblclick', () => {
    state.night = !state.night;
    document.getElementById('nightHint').textContent = state.night ? '☀ dbl-click' : '☾ dbl-click';
  });

  // Tool buttons
  document.getElementById('btnSponge').addEventListener('click', () => {
    state.tool = 'sponge';
    document.getElementById('hint').textContent = 'Зажми и три грязные пятна ✦';
    document.querySelectorAll('.tools button').forEach(b => b.className = '');
    document.getElementById('btnSponge').className = 'active-sponge';
  });

  document.getElementById('btnNet').addEventListener('click', () => {
    state.tool = 'net';
    document.getElementById('hint').textContent = 'Нажми на красную рыбку или рыбку кверху брюхом ✦';
    document.querySelectorAll('.tools button').forEach(b => b.className = '');
    document.getElementById('btnNet').className = 'active-net';
  });

  document.getElementById('btnFeed').addEventListener('click', () => {
    state.tool = 'feed';
    document.getElementById('hint').textContent = 'Кликни по воде, чтобы покормить ✦';
    document.querySelectorAll('.tools button').forEach(b => b.className = '');
    document.getElementById('btnFeed').className = 'active-feed';
  });

  // Gift box
  document.getElementById('giftBox').addEventListener('click', () => {
    document.getElementById('giftContent').innerHTML = `
      <div class="gift-card">
        <div class="sparkle">✨</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">✨</div>
        <div class="achievement">
          <div class="achievement-icon">🏆</div>
          <div>
            <div class="achievement-label">ДОСТИЖЕНИЕ РАЗБЛОКИРОВАНО!</div>
            <div class="achievement-title">Самая сексуальная рыбка аквариума</div>
            <div class="achievement-desc">Нашла секретного моллюска и не испугалась 😉</div>
          </div>
        </div>
        <button class="close-btn" onclick="document.getElementById('giftOverlay').classList.remove('show')">Закрыть 💗</button>
      </div>
    `;
  });

  document.getElementById('giftOverlay').addEventListener('click', e => {
    if (e.target.id === 'giftOverlay') {
      document.getElementById('giftOverlay').classList.remove('show');
    }
  });

  // Start
  showQuest();
  setInterval(checkCompletion, 500);
  update();
})();
</script>
</body>
</html>
